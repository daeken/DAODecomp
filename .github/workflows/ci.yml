name: validation-infrastructure
on: [push, pull_request]
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/update_progress.py --staged --check
      - run: python -m pip install -r requirements-validation.txt
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - run: cmake --build build --config RelWithDebInfo --parallel 2
      - run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
      - if: runner.os != 'Windows'
        run: python examples/synthetic/demo.py
      - if: runner.os != 'Windows'
        run: python examples/synthetic/demo.py --expect-mismatch
      - if: runner.os == 'Windows'
        run: python examples/synthetic/demo.py --build-dir build/RelWithDebInfo
      - if: runner.os == 'Windows'
        run: python examples/synthetic/demo.py --build-dir build/RelWithDebInfo --expect-mismatch
