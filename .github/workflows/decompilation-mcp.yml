name: decompilation-mcp

on: [push, pull_request]

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/decompilation-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: tools/decompilation-mcp/global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore -c Release
      - run: python -m unittest discover -s tests -v
